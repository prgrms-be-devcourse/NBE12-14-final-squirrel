# PR 과 dev 머지마다 빌드(-Werror 컴파일 포함)와 전체 테스트를 돌린다.
# 테스트의 비밀 값은 TestSecrets 가 실행할 때 만들고 DB·Redis 는 Testcontainers 가 띄우므로 GitHub Secrets 가 필요 없다.
# client/·doc/ 만 바뀐 PR 도 건너뛰지 않는다. (paths-ignore 로 건너뛰면 "CI 통과 필수" 규칙에서 체크가 계속 대기 상태로 남는다)
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

# 같은 브랜치에 커밋을 연달아 올리면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # 컴파일 + 테스트 + 커버리지 리포트(test 가 끝나면 jacocoTestReport 가 이어서 돈다)
      - run: ./gradlew build

      # 테스트가 실패해도 원인을 볼 수 있게 리포트를 남긴다.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html
