# 운영 서버에 배포한다. main 에 머지(푸시)되면 자동으로 돌고, GitHub 의 Actions 탭에서 "Run workflow" 로 직접 실행할 수도 있다.
#   jar 빌드 → 이미지 빌드 → Docker Hub 에 올리기 → 서버에 SSH 로 deploy.sh 호출(태그만 전달) → 바깥에서 헬스 확인
# 테스트는 여기서 돌리지 않는다. PR 과 dev 머지마다 CI 가 돌리므로, 배포하는 브랜치는 CI 가 통과한 것을 쓴다.
# 서버를 켜 둔 시간(09~18시) 밖에 main 에 머지하면 SSH 가 닿지 않아 실패한다. 서버를 켠 뒤 직접 실행으로 다시 돌린다.
#
# 필요한 설정 (GitHub 저장소 Settings → Secrets and variables → Actions)
#   Secrets:   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN(쓰기 권한), DEPLOY_SSH_KEY(배포 전용 SSH 개인 키), DEPLOY_KNOWN_HOSTS(서버의 호스트 키)
#   Variables: DOCKERHUB_REPOSITORY(예: 아이디/저장소), DEPLOY_HOST(서버 주소)
name: Deploy

on:
  push:
    branches: [main]
    # 문서나 프론트만 바뀐 머지로 서버를 다시 띄우지 않는다. (프론트는 Vercel 이 따로 배포한다)
    paths-ignore:
      - 'doc/**'
      - 'client/**'
      - '**.md'
  workflow_dispatch:

# 배포가 동시에 두 번 돌지 않게 한다. 진행 중인 배포를 취소하지 않고 기다린다.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      # 서버에서 Gradle 빌드를 하지 않는다. 여기서 jar 만 만들고 Dockerfile 이 그 jar 로 이미지를 만든다.
      - run: ./gradlew bootJar -x test

      # 태그는 커밋 해시 앞 12자리다. latest 는 쓰지 않는다. (이름이 같은 채 내용이 바뀌어 새로 받지 않고, 되돌릴 수도 없다)
      - name: Set image tag
        run: echo "TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.DOCKERHUB_REPOSITORY }}:${{ env.TAG }}

      # 서버에 배포를 시킨다. 이 SSH 키는 서버에서 deploy.sh 하나만 실행하도록 제한돼 있어서 넘기는 것은 태그뿐이다.
      # 호스트 키를 미리 저장해 두고 확인한다. (처음 접속하는 서버를 그냥 믿고 들어가지 않는다)
      - name: Deploy to server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes "ubuntu@${DEPLOY_HOST}" "$TAG"

      # 서버 안에서 건강하다고 끝난 뒤, 인터넷에서 HTTPS 로도 실제로 닿는지 확인한다. (Nginx·인증서·DNS 까지 포함)
      - name: Check from outside
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS https://api.noresell.store/actuator/health | grep -q '"status":"UP"'; then
              echo "OK"
              exit 0
            fi
            sleep 5
          done
          echo "바깥에서 헬스 확인에 실패했습니다."
          exit 1
