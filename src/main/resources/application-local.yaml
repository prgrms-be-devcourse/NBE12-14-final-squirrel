# 로컬 개발 설정. 프로필을 따로 주지 않으면 이 파일이 적용된다.
spring:
  config:
    # 프로젝트 루트의 .env 를 읽는다. (없어도 기동은 된다)
    # .env 는 git 에 올라가지 않고 팀 안에서 따로 전달받는다.
    # 쓰는 키: DATASOURCE_URL, DATASOURCE_USERNAME, DATASOURCE_PASSWORD, JWT_SECRET (기본값이 없어서 모두 .env 에 있어야 한다)
    # 따옴표를 쓰지 말고 = 앞뒤에 공백을 넣지 않는다. 실행 위치가 프로젝트 루트여야 .env 를 찾는다.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  flyway:
    # 스키마는 db/migration, 데모·샘플 데이터(공연장·공연 시드 등)는 db/seed.
    # 시드는 로컬에서만 적용한다. 버전 번호는 두 폴더가 같은 순번을 공유한다.
    # 시드는 V100 번대를 쓰고(V2 약관 시드만 예외), 마이그레이션은 V7 부터 이어서 추가한다.
    locations: classpath:db/migration,classpath:db/seed
    # 시드(V100 번대)를 이미 적용한 로컬 DB 에도, 새로 받은 마이그레이션(V7 ...)을 적용할 수 있게 한다.
    out-of-order: true

app:
  cookie:
    # 로컬은 http 라서 Secure 쿠키가 저장되지 않는다.
    secure: false

jwt:
  # 로컬 개발 전용 기본값이다. (HS 서명은 32바이트 이상이어야 한다)
  # 운영에서는 이 값을 쓰지 않고 환경 변수 JWT_SECRET 을 반드시 설정한다.
  secret: ${JWT_SECRET}
