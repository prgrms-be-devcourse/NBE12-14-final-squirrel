# 로컬 개발 설정. 프로필을 따로 주지 않으면 이 파일이 적용된다.
spring:
  config:
    # 프로젝트 루트의 .env 를 읽는다. (없어도 기동은 된다)
    # .env 는 git 에 올라가지 않고 팀 안에서 따로 전달받는다.
    # 쓰는 키: DATASOURCE_URL, DATASOURCE_USERNAME, DATASOURCE_PASSWORD, JWT_SECRET (기본값이 없어서 모두 .env 에 있어야 한다)
    # 이미지 업로드(S3)에 쓰는 키: S3_BUCKET, AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, IMAGE_BASE_URL (이것도 모두 필수)
    # 이미지를 실제로 올려 보려면 진짜 AWS 키가 필요하다. 올려 보지 않는 사람은 앱이 뜨도록 값만 채워 두면 된다. (시작할 때 AWS 를 부르지 않는다)
    # 이메일 인증 메일에 쓰는 키: MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM (모두 필수)
    # 로컬은 Mailpit(개발용 가짜 메일 서버)을 쓴다: MAIL_HOST=localhost, MAIL_PORT=1025, 사용자·비밀번호는 빈 값, MAIL_FROM=no-reply@tickting.local. doc/local-multi-server.md 참고
    # 따옴표를 쓰지 말고 = 앞뒤에 공백을 넣지 않는다. 실행 위치가 프로젝트 루트여야 .env 를 찾는다.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  mail:
    properties:
      # 로컬 Mailpit 은 암호화(STARTTLS)를 지원하지 않는다. 공통 설정의 "암호화 필수"를 로컬에서만 낮춘다. 운영에서는 이 값을 쓰지 않는다.
      mail.smtp.starttls.required: false
      # Mailpit 은 로그인 기능이 없다. 켜 두면 사용자·비밀번호가 빈 값이어도 로그인에 실패해서 메일이 안 나간다.
      mail.smtp.auth: false
  flyway:
    # 공통 위치(db/migration, db/seed)에 로컬 전용 시연 시드(db/seed-demo: 판매자, 공연, 시연 유저·예매)를 더한다. 버전 번호는 세 폴더가 같은 순번을 공유한다.
    # 시드는 V100 번대를 쓰고, 마이그레이션은 V12 부터 이어서 추가한다.
    locations: classpath:db/migration,classpath:db/seed,classpath:db/seed-demo
    # 시드 파일을 새 번호로 바꿔 넣는 동안 이미 적용한 로컬 DB 에도, 새로 받은 마이그레이션을 적용할 수 있게 한다.
    out-of-order: true
    # 예전 로컬 시드(V100~V103, V2)를 지웠다. 그 시드를 이미 적용한 로컬 DB 가 "적용한 마이그레이션 파일이 없다"며 뜨지 않는 일이 없게 한다.
    # (그 DB 에는 예전 샘플 공연장·공연이 남는다. 깨끗하게 쓰려면 로컬 DB 를 새로 만든다)
    ignore-migration-patterns: "*:missing"

app:
  payment:
    # mock 이면 토스 키 없이 결제 흐름이 돈다. 실제 토스 테스트 결제를 쓰려면 toss 로 두고 TOSS_SECRET_KEY 도 넣는다.
    # (결제창을 여는 클라이언트 키 TOSS_CLIENT_KEY 는 서버가 아니라 프론트가 읽는다)
    # 쓰는 키: PAYMENT_GATEWAY(필수, mock 또는 toss), TOSS_SECRET_KEY(toss 일 때만 필수)
    gateway: ${PAYMENT_GATEWAY}
  cookie:
    # 로컬은 http 라서 Secure 쿠키가 저장되지 않는다.
    secure: false
  captcha:
    # mock 이면 구글 키 없이 동작한다. 실제 reCAPTCHA 를 확인하려면 recaptcha 로 두고 RECAPTCHA_SECRET_KEY 도 넣는다.
    # 쓰는 키: CAPTCHA_VERIFIER(필수, mock 또는 recaptcha), RECAPTCHA_SECRET_KEY(recaptcha 일 때만 필수)
    verifier: ${CAPTCHA_VERIFIER}

jwt:
  # 로컬 개발 전용 기본값이다. (HS 서명은 32바이트 이상이어야 한다)
  # 운영에서는 이 값을 쓰지 않고 환경 변수 JWT_SECRET 을 반드시 설정한다.
  secret: ${JWT_SECRET}
