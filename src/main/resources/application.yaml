# 로컬·운영 공통 설정.
# 환경마다 다른 값(DB 접속 정보, .env 로딩)은 프로필 파일로 나눴다.
#   application-local.yaml  로컬 개발 (프로필을 안 주면 이게 켜진다)
# 운영 프로필(application-prod.yaml)은 배포 방식을 정한 뒤 추가한다.
spring:
  profiles:
    default: local
  application:
    name: tickting
  mail:
    # 이메일 인증번호 메일(SMTP). 접속 정보는 .env 에서 읽고 여기에 적지 않는다. (로컬에서 쓰는 값은 application-local.yaml 주석 참고)
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      # 메일 서버가 응답하지 않을 때 무한정 기다리면 발송 스레드가 묶인다. 넘으면 발송 실패로 처리한다. 단위는 밀리초 (임시값)
      # 읽기·쓰기 제한은 SMTP 명령마다 따로 적용돼서 전체 시간은 이보다 길 수 있다.
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      # 암호화(STARTTLS)를 쓰고 로그인(SMTP 인증)을 한다. 587 포트 기준이다. (465 는 처음부터 TLS 라서 mail.smtp.ssl.enable 을 쓴다)
      # required 는 암호화를 못 하는 서버에는 아예 보내지 않는다. 안 그러면 메일 서버 비밀번호와 인증번호가 평문으로 나간다.
      # 안전한 쪽이 기본이다. 암호화를 지원하지 않는 로컬 Mailpit 만 application-local.yaml 에서 required 를 낮춘다. (쿠키 secure 와 같은 방식)
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      # 로그인이 필요한 서버(SES·Gmail)에 쓴다. 로그인 기능이 없는 서버에 켜면 로그인에 실패해서 못 보내므로(테스트로 확인했다),
      # 로그인이 없는 로컬 Mailpit 만 application-local.yaml 에서 끈다.
      mail.smtp.auth: true
  jpa:
    # 요청이 끝난 뒤에도 DB 연결을 붙잡고 있지 않도록 끈다.
    open-in-view: false
    hibernate:
      # 테이블은 Flyway 가 만든다. 엔티티와 DB 가 다르면 앱이 뜨지 않는다.
      ddl-auto: validate
    properties:
      hibernate:
        # 목록 조회 때 연관 엔티티를 N+1 로 읽지 않고 묶어서 읽는다.
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    # 스키마(db/migration)와 시드(db/seed: 공연장·좌석, 약관, 관리자)를 모든 환경에 적용한다.
    # 판매자·공연·시연 예매(db/seed-demo)는 로컬에서만 적용한다. (application-local.yaml) 운영은 판매자 가입 → 승인 → 공연 신청을 직접 시험한다.
    # 개발용 공연장은 시드에 없고 테스트 전용 시드(src/test/resources/db/test-seed)에만 있다.
    locations: classpath:db/migration,classpath:db/seed
  data:
    web:
      pageable:
        # 클라이언트가 size 를 크게 넣어 한 번에 다 긁어가는 것을 막는다.
        max-page-size: 50
  servlet:
    multipart:
      # 이미지 업로드 크기 제한. 파일은 ImageService 의 10MB 와 같은 값이다. (기본값 1MB 면 큰 사진이 거절된다) 넘으면 400
      max-file-size: 10MB
      max-request-size: 11MB
  session:
    # v2 로그인(Redis 세션). 마지막 요청 후 이 시간이 지나면 세션이 사라진다. (요청이 올 때마다 연장된다)
    timeout: 30m
    data:
      redis:
        namespace: tickting:session

app:
  payment:
    # 결제 대행사 구현. toss 는 실제 토스(테스트 키면 테스트 결제), mock 은 키 없이 흐름만 확인한다.
    # 기본은 toss 다. 실수로 mock 이 운영에 켜지면 돈 없이 결제가 승인되므로 mock 은 로컬 프로필에서만 고른다.
    gateway: toss
    # 같은 예매에 결제 요청이 겹칠 때 기다리는 시간. 넘으면 COMMON004(409)
    lock-wait: 1s
    # 승인을 시작할 때 점유(예매 결제 제한 시각, 좌석 점유 시각)를 늘리는 시간. 토스를 부르는 동안 좌석이 풀리지 않게 한다. (예매당 한 번)
    confirm-extension: 2m
    # 실패했거나 결과를 모르는 환불을 같은 멱등키로 다시 보내는 작업 (doc/part5-operations-area.md 5-2 ③)
    refund-retry:
      enabled: true
      interval: 1m
      # 마지막으로 보낸 뒤 이만큼 지나야 다시 보낸다. 토스 응답 제한(10초)보다 충분히 길어야 응답을 기다리는 중인 환불을 다시 보내지 않는다.
      # 재시도 3번이 15분에 걸쳐 나뉘어서, 토스가 잠깐 멈춘 정도로는 관리자 목록에 바로 올라가지 않는다.
      delay: 5m
      # 실패한 환불을 자동으로 다시 보내는 횟수. 넘으면 관리자가 처리한다.
      max-count: 3
      batch-size: 100
      # 토스 멱등키는 처음 요청한 날부터 15일만 유효하다(토스 문서). 지나면 같은 키도 새 환불로 처리될 수 있어서
      # 관리자 재처리(ADM-06)를 막고 토스에서 실제 환불 여부를 확인하게 한다.
      idempotency-key-validity: 15d
    # 승인 결과를 모르는 채 남은 결제를 토스에 조회해서 확정하는 작업 (doc/part5-operations-area.md 5-2 ②). 아래 시간은 모두 임시값이다.
    reconcile:
      enabled: true
      interval: 5m
      # 결제를 준비한 지 이 시간이 지난 준비(READY) 건부터 조회한다. 예매 점유(7분)와 승인 때 늘리는 시간(2분), 만료 정리 주기(1분)가
      # 모두 지난 뒤여야 결제창을 열어 두고 결제 중인 사용자의 예매를 건드리지 않는다.
      ready-after: 15m
      # 승인을 시작한 지 이 시간이 지난 승인 중 건부터 조회한다. 토스 응답 제한(10초)보다 충분히 길어야 응답을 기다리는 중인 승인을 건드리지 않는다.
      processing-after: 5m
      # 토스가 아직 끝나지 않았다고만 답하는 결제를 이 시간이 지나면 결제되지 않은 것으로 닫는다.
      # 토스는 결제 요청 뒤 10분 안에 승인하지 않으면 결제 정보를 지우고, 우리는 승인을 다시 보내지 않아서 그 뒤에는 결제될 수 없다.
      give-up-after: 1h
      batch-size: 100
  booking:
    # 좌석·사용자 락을 기다리는 시간. 길수록 인기 좌석에 요청이 쌓이므로 짧게 둔다. 넘으면 COMMON004(409)
    lock-wait: 1s
    # 좌석을 잡고 결제를 기다려 주는 시간 (임시 정책)
    hold-duration: 7m
    # 결제하지 않은 점유를 풀어 주는 작업. 주기가 길수록 풀린 좌석이 늦게 다시 보인다. 부하 테스트에서 부담이 보이면 코드 없이 바꾼다.
    expiry-enabled: true
    expiry-interval: 1m
    expiry-batch-size: 500
  queue:
    # 회차별 대기열. 끄면 누구나 바로 입장한 것으로 본다. (테스트·로컬 확인용. 운영은 켠다)
    enabled: true
    # 회차마다 동시에 입장해 있을 수 있는 인원. 서버(t3.small)가 버티는 요청 수에 맞춰 부하 테스트로 정한다. (임시값)
    max-active: 1000
    # 입장한 뒤 구역·좌석을 보고 좌석을 잡을 수 있는 시간. 지나면 자리가 비고 다시 줄을 서야 한다 (임시 정책)
    entry-ttl: 10m
    # 대기 중인 사람이 이 시간 동안 상태 확인을 하지 않으면 떠난 것으로 보고 건너뛴다. 화면의 확인 주기(2~3초)보다 충분히 길게 둔다
    waiting-timeout: 30s
  s3:
    # 이미지를 올리는 S3. 서버가 파일을 받아 S3 에 올린다. 키는 .env 에서 읽고 여기에 적지 않는다.
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION}
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}
    # 버킷 루트 주소(https://{버킷}.s3.{리전}.amazonaws.com). 등록하는 이미지 주소는 이 주소로 시작하는 https 여야 한다.
    # 저장 경로가 public/ 으로 시작하므로 /public 을 붙이면 주소가 public/public/… 이 된다.
    base-url: ${IMAGE_BASE_URL}
  performance:
    # 판매자가 등급 가격을 고칠 때 공연 단위 락을 기다리는 시간. 판매 좌석 생성이나 다른 수정과 겹칠 때만 기다린다. 넘으면 COMMON004(409)
    lock-wait: 1s
    # 판매 오픈 24시간 전이 지난 공개 공연 회차의 판매 좌석을 만드는 작업 (doc/part3-performance-area.md 3-5)
    # 문제가 생기면 코드를 고치지 않고 끄고 재시작한다. 꺼도 판매자의 "좌석 지금 생성" 버튼은 동작한다.
    seat-generation:
      enabled: true
      # (임시) 공개 조건(판매 오픈까지 3시간 초과)은 오픈 전에 최소 두 번 도는 것을 전제로 하므로, 늘리면 그 조건도 다시 정한다.
      interval: 1h
  auth:
    login:
      # 같은 IP 에서 같은 이메일로 이 횟수만큼 비밀번호를 틀리면 잠근다. 잠긴 동안은 비밀번호가 맞아도 429(AUTH004) (임시 정책)
      max-failures: 5
      # 잠그는 시간. 실패 횟수도 첫 실패부터 이 시간 안의 것만 센다 (임시 정책)
      lock-duration: 5m
    email-verification:
      # 이메일 인증번호 (모두 임시 정책)
      # 인증번호 유효 시간
      code-ttl: 5m
      # 인증번호를 맞힌 뒤 가입을 마칠 때까지 그 이메일의 인증이 유효한 시간. 넘으면 다시 인증한다 (가입에 성공하면 바로 소모된다)
      verified-ttl: 20m
      # 이 횟수만큼 틀리면 그 인증번호는 폐기한다. 새로 받아야 한다
      max-attempts: 5
      # 재발송 간격. 발송이 나중에 실패해도 이 간격은 그대로다
      resend-interval: 60s
      # 하루 발송 한도. 한국 시간 자정에 초기화된다
      daily-limit: 10
      # 메일의 보낸 사람 이름과 제목에 쓰는 서비스 이름
      sender-name: 리셀노
      # 메일의 보낸 사람 주소. .env(운영은 환경 변수)의 MAIL_FROM 에서 읽는다. 운영은 메일 서비스에서 확인을 마친 주소여야 한다.
      # 기본값을 두지 않는다: 빠뜨리면 앱이 안 뜬다. (기본값이 있으면 운영에서 깜빡해도 앱은 뜨고, 비동기 발송이라 화면에는 성공으로 보이면서 메일만 거절된다)
      from-address: ${MAIL_FROM}
      # 발송은 비동기다. 서버마다 따로 센다. 대기가 가득 차면 바로 거절한다(503 AUTH304). 부하 테스트로 정한다 (임시값)
      send-threads: 10
      send-queue: 200
    password-reset:
      # 비밀번호 재설정 링크 (모두 임시 정책)
      # 링크 유효 시간. 메일이 도착해서 새 비밀번호를 제출할 때까지를 모두 포함한다
      link-ttl: 15m
      # 같은 계정 종류·이메일로 다시 요청할 수 있기까지의 간격. 발송이 나중에 실패해도 이 간격은 그대로다
      resend-interval: 60s
      # 계정 종류·이메일당 하루 요청 한도. 한국 시간 자정에 초기화된다
      daily-limit: 10
      # 메일 링크의 앞부분(프론트 주소). .env(운영은 환경 변수)의 FRONTEND_BASE_URL 에서 읽는다. 끝에 / 를 붙이지 않는다
      # 기본값을 두지 않는다: 빠뜨리면 앱이 안 뜬다. (기본값이 있으면 운영에서 깜빡해도 메일에 엉뚱한 주소의 링크가 들어간다)
      frontend-base-url: ${FRONTEND_BASE_URL}
    password-hash:
      # 서버 한 대에서 BCrypt 를 동시에 계산하는 개수. CPU(t3.small 2개)보다 많이 돌려도 빨라지지 않고 모두 함께 느려진다 (임시값, 부하 테스트로 정한다)
      max-concurrent: 4
      # 자리가 날 때까지 기다리는 시간. 길면 기다리는 요청이 톰캣 스레드를 쥐고 쌓이고, 짧으면 잠깐 붐빌 때도 돌려보낸다. 넘으면 503(COMMON005) (임시값)
      wait-timeout: 1s
  cookie:
    # 리프레시 토큰 쿠키. secure 는 안전한 쪽(true)이 기본이고 로컬 프로필에서만 낮춘다.
    secure: true
    same-site: Lax
    path: /api/v1/auth

  captcha:
    # 캡챠 검증 구현. recaptcha 는 구글에 실제로 묻고, mock 은 키 없이 흐름만 확인한다. mock 은 로컬 프로필에서만 고른다.
    verifier: recaptcha
    # 이 점수보다 낮으면 사람이 아닌 것으로 본다 (0.0~1.0, 임시값)
    min-score: 0.5

# 구글 reCAPTCHA v3. secret-key 는 .env 의 RECAPTCHA_SECRET_KEY 에서 읽고 여기에 적지 않는다. (verifier 가 recaptcha 일 때만 읽는다)
recaptcha:
  base-url: https://www.google.com
  secret-key: ${RECAPTCHA_SECRET_KEY}
  connect-timeout: 2s
  read-timeout: 3s

# 토스페이먼츠. secret-key 는 .env 의 TOSS_SECRET_KEY 에서 읽고 여기에 적지 않는다. (app.payment.gateway 가 toss 일 때만 읽는다)
toss:
  base-url: https://api.tosspayments.com
  secret-key: ${TOSS_SECRET_KEY}
  connect-timeout: 2s
  # 넘으면 승인됐는지 알 수 없는 상태(승인 중)로 두고 스케줄러가 조회해서 확정한다. 너무 짧으면 승인된 결제를 모르는 일이 늘어난다.
  read-timeout: 10s

jwt:
  issuer: tickting
  # 짧게 두고, 로그아웃·비활성화한 계정의 토큰은 Redis 블랙리스트로 막는다.
  access-token-validity-seconds: 900
  refresh-token-validity-seconds: 1209600
  # secret 은 환경마다 다르다. 로컬은 application-local.yaml, 운영은 환경 변수 JWT_SECRET.

server:
  # 앞단 Nginx 가 넘겨준 X-Forwarded-For 로 실제 사용자 IP 를 읽는다. (로그인 실패 제한이 IP 를 쓴다)
  # 없으면 모든 요청이 Nginx 주소에서 온 것으로 보여서, IP 별 제한이 사실상 "모든 사용자 공통" 이 된다.
  # 톰캣은 사설망 주소(10.x, 172.16~31.x, 192.168.x, 127.x)에서 온 값만 프록시로 믿는다. 운영 Nginx 는 X-Forwarded-For 를 $remote_addr 로 덮어써서 사용자가 위조할 수 없게 한다.
  forward-headers-strategy: native

management:
  health:
    mail:
      # 메일 서버 접속 확인을 health 에 넣지 않는다. 메일이 안 돼도 이미 인증한 사람의 예매는 되는데, health 가 DOWN 이면 서버가 제외될 수 있다.
      # 메일 상태는 발송 성공·실패 지표로 본다.
      enabled: false
  endpoints:
    web:
      exposure:
        # 필요한 것만 연다. env, heapdump 등은 민감 정보가 나가므로 열지 않는다.
        include: health, info
