# 로컬·운영 공통 설정.
# 환경마다 다른 값(DB 접속 정보, .env 로딩)은 프로필 파일로 나눴다.
#   application-local.yaml  로컬 개발 (프로필을 안 주면 이게 켜진다)
# 운영 프로필(application-prod.yaml)은 배포 방식을 정한 뒤 추가한다.
spring:
  profiles:
    default: local
  application:
    name: tickting
  jpa:
    # 요청이 끝난 뒤에도 DB 연결을 붙잡고 있지 않도록 끈다.
    open-in-view: false
    hibernate:
      # 테이블은 Flyway 가 만든다. 엔티티와 DB 가 다르면 앱이 뜨지 않는다.
      ddl-auto: validate
    properties:
      hibernate:
        # 목록 조회 때 연관 엔티티를 N+1 로 읽지 않고 묶어서 읽는다.
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # 클라이언트가 size 를 크게 넣어 한 번에 다 긁어가는 것을 막는다.
        max-page-size: 50
  session:
    # v2 로그인(Redis 세션). 마지막 요청 후 이 시간이 지나면 세션이 사라진다. (요청이 올 때마다 연장된다)
    timeout: 30m
    data:
      redis:
        namespace: tickting:session

app:
  cookie:
    # 리프레시 토큰 쿠키. secure 는 안전한 쪽(true)이 기본이고 로컬 프로필에서만 낮춘다.
    secure: true
    same-site: Lax
    path: /api/v1/auth

jwt:
  issuer: tickting
  # 짧게 두고, 로그아웃·비활성화한 계정의 토큰은 Redis 블랙리스트로 막는다.
  access-token-validity-seconds: 900
  refresh-token-validity-seconds: 1209600
  # secret 은 환경마다 다르다. 로컬은 application-local.yaml, 운영은 환경 변수 JWT_SECRET.

management:
  endpoints:
    web:
      exposure:
        # 필요한 것만 연다. env, heapdump 등은 민감 정보가 나가므로 열지 않는다.
        include: health, info
