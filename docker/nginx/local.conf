# 로컬 전용 로드밸런서 설정. (운영은 AWS ALB 를 쓰고 Nginx 는 쓰지 않는다)
# docker compose 의 nginx 서비스가 /etc/nginx/conf.d/default.conf 로 마운트한다.
#
# 앱은 컨테이너가 아니라 내 PC 에서 포트를 다르게 해서 여러 대 띄운다. (8081, 8082)
# Nginx 컨테이너는 host.docker.internal 로 내 PC 의 그 포트들에 나눠 보낸다.
# 서버가 여러 대여도 같은 결과가 나오는지 확인하는 용도다.
# 로그인 세션은 Redis 에 있어서 어느 서버로 가도 되므로 고정 연결(sticky)을 쓰지 않고 돌아가며 보낸다.
# 앱을 더 늘리려면 아래에 server 줄을 추가한다.
upstream tickting_app {
	# 워커 프로세스끼리 순서를 공유한다. 없으면 워커마다 따로 세서 적은 요청에서는 한쪽으로 치우쳐 보인다.
	zone tickting_app 64k;
	server host.docker.internal:8081;
	server host.docker.internal:8082;
}

server {
	listen 80;

	location / {
		proxy_pass http://tickting_app;
		proxy_http_version 1.1;
		proxy_set_header Connection "";

		# 앱이 실제 사용자 IP 를 X-Forwarded-For 로 읽는다. (요청 빈도 제한 등)
		# 앞단에 다른 프록시가 있으면 그 값 뒤에 이어 붙인다.
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# 연결이 안 되거나 시간이 초과되면 다른 서버로 한 번 넘긴다. (앱 한 대를 꺼도 응답이 유지된다)
		# 결제·예매 같은 POST 는 기본적으로 다시 보내지 않는다. (중복 처리 방지)
		proxy_next_upstream error timeout;
		proxy_connect_timeout 3s;
		proxy_read_timeout 30s;

		# 어느 서버가 응답했는지 확인하려고 응답 헤더에 남긴다. (로컬 확인용)
		add_header X-Upstream $upstream_addr always;
	}
}
