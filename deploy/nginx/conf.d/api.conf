# api.noresell.store 의 정문 설정. 인터넷에서 오는 요청을 받아 HTTPS 로 처리하고, 같은 서버의 앱 컨테이너로 전달한다.
# compose 의 nginx 컨테이너가 이 폴더(conf.d)를 읽는다. 인증서는 certbot 이 서버의 ./certbot/conf 에 저장하고 컨테이너의 /etc/letsencrypt 로 보인다.
# 인증서 파일이 없으면 nginx 가 뜨지 않는다. 처음에는 인증서를 먼저 받아야 한다. (deploy/README.md 의 HTTPS 순서)

# 80번(HTTP): 모든 요청을 HTTPS 로 돌려보낸다.
# 로그인 쿠키(SESSION)가 Secure 라서 HTTPS 가 아니면 브라우저가 쿠키를 저장하지 않아 로그인이 안 된다.
server {
    listen 80;
    server_name api.noresell.store;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443번(HTTPS)
server {
    listen 443 ssl;
    http2 on;
    server_name api.noresell.store;

    # 응답 헤더에 nginx 버전을 알리지 않는다.
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/api.noresell.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.noresell.store/privkey.pem;
    # 오래된 TLS(1.0, 1.1)는 쓰지 않는다.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 브라우저에 "이 주소는 앞으로 HTTPS 로만 접속하라"고 기억시킨다. 처음에는 하루로 짧게 둔다.
    # (HTTPS 설정이 틀렸을 때 길게 기억시켜 버리면 접속이 오래 막힌다. 안정되면 늘린다)
    add_header Strict-Transport-Security "max-age=86400" always;

    # 이미지 업로드는 최대 10MB(요청 전체 11MB)다. nginx 기본값(1MB)이면 큰 사진이 413 오류로 거절된다.
    client_max_body_size 11m;

    # 앱 컨테이너는 배포할 때마다 새로 만들어져 IP 가 바뀐다. nginx 는 시작할 때 이름을 한 번만 IP 로 바꾸므로,
    # 그대로 두면 앱을 교체한 뒤 옛 IP 로 보내 502 오류가 난다. Docker 의 내장 DNS(127.0.0.11)로 10초마다 다시 찾게 한다.
    # (이 방식은 proxy_pass 에 변수를 써야 동작한다)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream http://app:8080;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 앱이 이 헤더로 사용자 IP 를 읽는다. 앞에서 온 값을 이어 붙이지 않고 nginx 가 본 주소로 덮어써서, 사용자가 헤더를 위조할 수 없게 한다.
        # (프론트가 Vercel 이라 지금은 이 주소가 Vercel 서버의 IP 다. IP 별 로그인 잠금이 사용자별이 아니라 Vercel 단위로 동작하는 한계가 있다)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        # 결제 승인처럼 토스를 부르는 요청은 오래 걸릴 수 있다. 앱의 토스 읽기 제한(10초)보다 길게 둔다.
        proxy_read_timeout 30s;
    }
}
